<!DOCTYPE html>
<html lang="fr" data-title-key="page.title.dashboard">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // Apply the saved language direction before paint to avoid a layout flash.
        (function () {
            try {
                if (localStorage.getItem('mathyxo_language') === 'ar') {
                    document.documentElement.lang = 'ar';
                    document.documentElement.dir = 'rtl';
                }
            } catch (e) { /* ignore */ }
        })();
    </script>
    <title>Tableau de Bord - MatheuxMed</title>
    <link rel="stylesheet" href="../css/style.css?v=20261020f">
    <link rel="stylesheet" href="../css/dashboard.css?v=20261020f">
    <link rel="stylesheet" href="../css/rtl.css?v=20261020f">
    <link rel="stylesheet" href="../css/language-switcher.css?v=20261020f">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="header-container"></div>
    <div id="nav-container"></div>

    <main class="container">
        <div class="dashboard-header">
            <h1 data-i18n="dash.title">📊 Tableau de Bord</h1>
            <p id="welcome-message"></p>
        </div>

        <div class="dashboard-grid">
            <!-- Student Info Card -->
            <div class="dashboard-card">
                <h3 data-i18n="dash.profile">👤 Profil Étudiant</h3>
                <div id="student-profile">
                    <p><strong data-i18n="dash.name">Nom</strong>: <span id="student-name">-</span></p>
                    <p><strong data-i18n="dash.email">Email</strong>: <span id="student-email">-</span></p>
                    <p><strong data-i18n="dash.level">Niveau</strong>: <span id="student-level">-</span></p>
                    <p><strong data-i18n="dash.memberSince">Membre depuis</strong>: <span id="student-joined">-</span></p>
                </div>
            </div>

            <!-- Progress Stats -->
            <div class="dashboard-card">
                <h3 data-i18n="dash.stats">📈 Statistiques</h3>
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-number" id="completed-lessons">0</div>
                        <p data-i18n="dash.completedLessons">Leçons Complétées</p>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="total-points">0</div>
                        <p data-i18n="dash.totalPoints">Points Totaux</p>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="avg-score">0%</div>
                        <p data-i18n="dash.avgScore">Score Moyen</p>
                    </div>
                </div>
            </div>

            <!-- Progress by Level -->
            <div class="dashboard-card full-width">
                <h3 data-i18n="dash.progressByLevel">🎯 Progression par Niveau</h3>
                <div id="level-progress">
                    <p style="text-align: center; color: #999;" data-i18n="dash.loadingProgress">Chargement de la progression…</p>
                </div>
            </div>

            <!-- Recent Activity -->
            <div class="dashboard-card full-width">
                <h3 data-i18n="dash.recentActivity">📅 Activité Récente</h3>
                <div id="recent-activity">
                    <p style="text-align: center; color: #999;" data-i18n="dash.noActivity">Pas d'activité récente</p>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="dashboard-actions">
                <a href="../niveaux.html?cat=primaire" class="btn btn-primary">🔢 <span data-i18n="reg.cycle.primary">Primaire</span></a>
                <a href="../niveaux.html?cat=college" class="btn btn-primary">📐 <span data-i18n="reg.cycle.middle">Collège</span></a>
                <a href="../niveaux.html?cat=lycee" class="btn btn-primary">🎓 <span data-i18n="reg.cycle.high">Lycée</span></a>
                <button onclick="logoutUser()" class="btn btn-danger">🚪 <span data-i18n="auth.nav.logout">Déconnexion</span></button>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script>
        window.MATHYXO_SUPABASE_URL = 'https://sjuzppnrsdfxlvvugslq.supabase.co';
        window.MATHYXO_SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNqdXpwcG5yc2RmeGx2dnVnc2xxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3MzE3NjUsImV4cCI6MjEwNzMwNzc2NX0.Xkpv_t6LehqFj5xeq5ALUE10BJjOtVyr_ye_8K46RCI';
    </script>
    <script src="../js/i18n.js?v=20261020f"></script>
    <script src="../js/language-switcher.js?v=20261020f"></script>
    <script src="../js/components.js?v=20261020f"></script>
    <script src="../js/auth.js?v=20261020f"></script>

    <script>
        function uiLocale() {
            return (typeof I18N !== 'undefined' && I18N.currentLanguage === 'ar') ? 'ar-MA' : 'fr-FR';
        }

        document.addEventListener('DOMContentLoaded', async function () {
            if (!SUPABASE) {
                alert(t('dash.authUnavailable'));
                return;
            }

            const { data: sessionData } = await SUPABASE.auth.getSession();
            const session = sessionData && sessionData.session;

            if (!session) {
                alert(t('dash.loginRequired'));
                window.location.href = (window.MATHYXO_BASE || '/') + 'auth/login.html';
                return;
            }

            const user = session.user;
            const userData = await getCurrentUserData();

            const displayName = (userData && userData.display_name) ||
                (user.user_metadata && user.user_metadata.display_name) || t('profile.defaultStudent');
            const level = (userData && userData.level) ||
                (user.user_metadata && user.user_metadata.level) || '-';
            const joined = (userData && userData.created_at) || user.created_at;

            document.getElementById('student-name').textContent = displayName;
            document.getElementById('student-email').textContent = user.email || '-';
            document.getElementById('student-level').textContent = level;
            document.getElementById('student-joined').textContent =
                joined ? new Date(joined).toLocaleDateString(uiLocale()) : '-';
            document.getElementById('welcome-message').textContent = t('dash.welcome', { name: displayName });
            document.getElementById('total-points').textContent = (userData && userData.total_points) || 0;

            const progress = (await getUserProgress(user.id)).slice().sort((a, b) =>
                new Date(a.completed_at || 0) - new Date(b.completed_at || 0));
            const completed = progress.filter(p => p.completed);

            document.getElementById('completed-lessons').textContent = completed.length;

            if (progress.length > 0) {
                const avgScore = Math.round(
                    progress.reduce((sum, p) => sum + (Number(p.quiz_score) || 0), 0) / progress.length
                );
                document.getElementById('avg-score').textContent = avgScore + '%';
            }

            if (progress.length > 0) {
                const recent = progress.slice(-5).reverse();
                document.getElementById('recent-activity').innerHTML = recent.map(p => {
                    const date = p.completed_at
                        ? new Date(p.completed_at).toLocaleDateString(uiLocale())
                        : '';
                    return `<p>📝 Quiz ${p.lesson_id}: ${p.quiz_score}% - ${date}</p>`;
                }).join('');
            }

            try {
                const res = await fetch((window.MATHYXO_BASE || '/') + 'data/curriculum.json');
                const curriculum = await res.json();
                const lessonToLevel = {};
                const levelEntries = [];

                curriculum.categories.forEach(category => {
                    category.levels.forEach(level => {
                        const lessons = level.chapters.reduce(
                            (acc, chapter) => acc.concat(chapter.lessons), []
                        );
                        lessons.forEach(lesson => { lessonToLevel[lesson.id] = level.id; });
                        levelEntries.push({
                            id: level.id,
                            title: L(level, 'title'),
                            category: L(category, 'title'),
                            total: lessons.length
                        });
                    });
                });

                const container = document.getElementById('level-progress');
                container.innerHTML = levelEntries.map(entry => {
                    const done = completed.filter(p => lessonToLevel[p.lesson_id] === entry.id).length;
                    const pct = entry.total ? Math.round((done / entry.total) * 100) : 0;
                    return `
                        <div class="progress-item">
                            <h4>${entry.category} · ${entry.title}</h4>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${pct}%"></div>
                            </div>
                            <p>${t('dash.lessonsDone', { done: nt(done), total: nt(entry.total) })}</p>
                        </div>
                    `;
                }).join('') || `<p style="text-align: center; color: #999;">${t('dash.noLevel')}</p>`;
            } catch (error) {
                console.warn('Could not load curriculum for progress:', error);
                document.getElementById('level-progress').innerHTML =
                    `<p style="text-align: center; color: #999;">${t('dash.progressUnavailable')}</p>`;
            }
        });
    </script>
</body>
</html>
