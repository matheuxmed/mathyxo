    <script>
        function loadHomepageCurriculum() {
            const container = document.getElementById('levels-container');
            if (!container) return;

            fetch('./data/curriculum.json')
                .then(res => res.json())
                .then(curriculum => {
                    container.innerHTML = curriculum.levels.map(level => `
                        <section class="levels">
                            <article class="level-card">
                                <div class="level-icon">${level.icon}</div>
                                <h3>${level.title}</h3>
                                <p>${level.description}</p>
                                <div class="level-meta">
                                    <span>📊 ${level.category}</span>
                                    <span><strong>${level.lessons.length} leçons</strong></span>
                                </div>
                                <div class="level-progress">
                                    <div class="level-progress-bar" style="width: 50%"></div>
                                </div>
                                <a href="./${level.id}/" class="btn">Commencer →</a>
                            </article>
                        </section>
                    `).join('');
                })
                .catch(error => {
                    console.error('Homepage curriculum load failed:', error);
                    container.innerHTML = '<p>Le curriculum n\'a pas pu être chargé.</p>';
                });
        }

        document.addEventListener('DOMContentLoaded', function() {
            try {
                document.getElementById('hero-container').innerHTML = renderHero();
                document.getElementById('features-container').innerHTML = renderFeatures();
                document.getElementById('cta-container').innerHTML = renderCTA();
                loadHomepageCurriculum();
            } catch (error) {
                console.error('Error rendering homepage:', error);
            }
        });
    </script>
</body>
</html>
