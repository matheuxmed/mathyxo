<!DOCTYPE html>
<html lang="fr" data-title-key="page.title.home">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // Apply the saved language direction before paint to avoid a layout flash.
        (function () {
            try {
                if (localStorage.getItem('mathyxo_language') === 'ar') {
                    document.documentElement.lang = 'ar';
                    document.documentElement.dir = 'rtl';
                }
            } catch (e) { /* ignore */ }
        })();
    </script>
    <title>MatheuxMed - Mathématiques Lycée Marocain</title>
    <link rel="stylesheet" href="./css/style.css?v=20261020f">
    <link rel="stylesheet" href="./css/rtl.css?v=20261020f">
    <link rel="stylesheet" href="./css/language-switcher.css?v=20261020f">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="header-container"></div>
    <div id="nav-container"></div>

    <main class="container">
        <div id="hero-container"></div>
        <div id="levels-container"></div>
        <div id="features-container"></div>
        <div id="cta-container"></div>
    </main>

    <div id="footer-container"></div>

    <script>
        window.MATHYXO_SUPABASE_URL = 'https://sjuzppnrsdfxlvvugslq.supabase.co';
        window.MATHYXO_SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNqdXpwcG5yc2RmeGx2dnVnc2xxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3MzE3NjUsImV4cCI6MjEwNzMwNzc2NX0.Xkpv_t6LehqFj5xeq5ALUE10BJjOtVyr_ye_8K46RCI';
    </script>

    <!-- Load i18n FIRST -->
    <script src="./js/i18n.js?v=20261020f"></script>
    <script src="./js/language-switcher.js?v=20261020f"></script>
    
    <!-- Load components AFTER i18n -->
    <script src="./js/components.js?v=20261020f"></script>
    
    <!-- Load auth AFTER components -->
    <script src="./js/auth.js?v=20261020f"></script>

    <script>
        function loadHomepageCurriculum() {
            const container = document.getElementById('levels-container');
            if (!container) return;

            fetch('./data/curriculum.json')
                .then(res => res.json())
                .then(curriculum => {
                    const cards = (curriculum.categories || []).map(category => {
                        const levelCount = category.levels.length;
                        const lessonCount = category.levels.reduce(
                            (n, l) => n + l.chapters.reduce((m, c) => m + c.lessons.length, 0), 0
                        );
                        return `
                            <a class="level-card" href="./niveaux.html?cat=${encodeURIComponent(category.id)}">
                                <div class="level-icon">${category.icon}</div>
                                <h3>${L(category, 'title')}</h3>
                                <p>${L(category, 'description')}</p>
                                <div class="level-meta">
                                    <span>🏫 ${t('catalog.levelsCount', { n: nt(levelCount) })}</span>
                                    <span><strong>${lessonCount === 1 ? t('catalog.lessonCountOne') : t('catalog.lessonsCount', { n: nt(lessonCount) })}</strong></span>
                                </div>
                                <span class="btn">${t('catalog.explore')}</span>
                            </a>
                        `;
                    }).join('');
                    container.innerHTML = `
                        <h2 class="section-title">${t('catalog.chooseCycle')}</h2>
                        <section class="levels">${cards}</section>
                    `;
                })
                .catch(error => {
                    console.error('Homepage curriculum load failed:', error);
                    container.innerHTML = '<p>' + t('catalog.notLoaded') + '</p>';
                });
        }

        document.addEventListener('DOMContentLoaded', function() {
            try {
                if (typeof renderHero !== 'undefined') {
                    document.getElementById('hero-container').innerHTML = renderHero();
                } else {
                    console.warn('renderHero not available yet');
                }
                
                if (typeof renderFeatures !== 'undefined') {
                    document.getElementById('features-container').innerHTML = renderFeatures();
                }
                
                if (typeof renderCTA !== 'undefined') {
                    document.getElementById('cta-container').innerHTML = renderCTA();
                }
                
                loadHomepageCurriculum();
            } catch (error) {
                console.error('Error rendering homepage:', error);
            }
        });
    </script>
</body>
</html>
